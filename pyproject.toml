[project]
name = "xplain-rescue"
version = "0.1.0"
description = "Multi-YOLO Evaluation Framework with Explainability for Content Moderation"
authors = [
    {name = "XplainRescue Team"},
]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "ultralytics>=8.0.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "roboflow>=1.1.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.5",
    "pre-commit>=3.5.0",
    "mypy>=1.7.0",
    "types-PyYAML>=6.0.0",
    "types-tqdm>=4.66.0",
    "hypothesis>=6.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
xai = [
    "shap>=0.42.0,<1.0.0",
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0,<1.0.0",
    "zennit>=0.5.0,<1.0.0",
    "captum>=0.7.0,<1.0.0",
    "tensorflow>=2.13.0,<3.0.0",
    "ttach>=0.0.3,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR2004", # magic value used in comparison
    "ARG002",  # unused method argument
    "ARG004",  # unused static method argument
    "PLR0911", # too many return statements
    "PLC0415", # import not at top level (allow lazy imports)
    "PLW2901", # loop variable overwritten
    "RUF012",  # mutable class attributes
    "RUF043",  # regex metacharacters in match=
    "B904",    # raise from in except (too noisy for existing code)
    "PTH123",  # open() vs Path.open() (gradual migration)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # use of assert
    "PLR2004", # magic values in tests
    "ARG001",  # unused function arguments (fixtures)
    "B905",    # zip() without strict=
    "PTH108",  # os.unlink vs Path.unlink
    "RUF059",  # unpacked variable never used
]
"scripts/**/*.py" = [
    "T201",    # print statements allowed in scripts
    "E402",    # module level import not at top (sys.path manipulation)
    "F841",    # unused variables in scripts
]
"src/training/runner.py" = [
    "F841",    # unused variables (YOLO API returns)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ultralytics.*",
    "roboflow.*",
    "cv2.*",
    "hypothesis.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "yolo_cam.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "src.training.evaluator",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "property: marks tests as property-based tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "hypothesis>=6.0.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.5",
    "types-pyyaml>=6.0.0",
    "types-tqdm>=4.66.0",
]
