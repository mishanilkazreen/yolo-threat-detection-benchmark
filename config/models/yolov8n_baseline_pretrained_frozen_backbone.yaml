# YOLOv8n — One-shot Baseline, frozen backbone (COCO pretrained)
# freeze=10 locks backbone (layers 0-9); neck (10-21) + detect head (22) train freely.

training:
  epochs: 50
  patience: 0
  image_size: 640
  batch_size: 16
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.1
  freeze: 10
  runs: 1
  seeds: [42]
  device: "0"
  baseline_epochs: 50

model:
  name: "yolov8n"
  weights: "yolov8n.pt"

data:
  yaml_path: "config/data/weapon_detection_data.yaml"
  train_init_percentage: 0.2
  iou_threshold: 0.5

augmentation:
  mosaic: 1.0
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

xai:
  enabled: false
  methods:
    gradcam: true
    lrp: false
    shap: false
  sample_limit: 16
  target_layer: "model.18"
  background_set_size: 75
  output_overlays: true
