# YOLOv8n Test Configuration - fast smoke-test run

training:
  epochs_per_round: 1
  rounds: 2
  patience: 10
  image_size: 640
  batch_size: 16
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.1
  runs: 1
  seeds: [42]
  device: "0"
  run_baseline: false
  baseline_epochs: 1

model:
  name: "yolov8n"
  weights: "yolov8n.yaml"

data:
  yaml_path: "config/data/weapon_detection_data.local.yaml"
  train_init_percentage: 0.2
  iou_threshold: 0.5
