# YOLOv8n Training Configuration

training:
  epochs: 50
  epochs_per_round: 10
  rounds: 5
  patience: 10
  image_size: 640
  batch_size: 16
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.1
  runs: 1
  seeds: [42]
  device: "0"
  run_baseline: true
  baseline_epochs: 50

model:
  name: "yolov8n"
  # Architecture-only config: trains from random initialization (no COCO pretrained weights).
  # This matches Kutlu & Emiroğlu (2025) Algorithm 1 line 8:
  #   initialize_model(random_weights=True)
  # and Section 3.2: "Round 1 was trained from random initialization
  # (without ImageNet pre-training)".
  # Use "yolov8n.pt" instead for COCO-pretrained transfer learning.
  weights: "yolov8n.yaml"

data:
  yaml_path: "config/data/weapon_detection_data.yaml"
  train_init_percentage: 0.2
  iou_threshold: 0.5

augmentation:
  mosaic: 1.0
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

xai:
  enabled: true
  methods:
    gradcam: true
    lrp: true
    shap: true
  sample_limit: 16
  target_layer: "model.18"  # C2f [512] — neck P5, 20×20
  background_set_size: 75
  output_overlays: true
