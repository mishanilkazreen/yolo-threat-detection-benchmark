# YOLOv8n Training Configuration with XAI Explainability

training:
  epochs: 25  # Total epochs across all rounds
  epochs_per_round: 5  # Epochs per round
  rounds: 5  # Number of incremental training rounds
  patience: 10
  image_size: 640
  batch_size: 16
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.1
  runs: 1  # Number of runs for statistical analysis
  seeds: [42]  # Fixed seeds for each run
  device: "0"  # GPU device

model:
  name: "yolov8n"
  weights: "yolov8n.pt"  # Pretrained weights (auto-downloaded)

data:
  yaml_path: "config/data/weapon_detection_data.yaml"
  train_init_percentage: 0.2  # Start with 20% of training data in Round 1
  iou_threshold: 0.5  # IoU threshold for detection validation

# XAI Explainability Configuration
xai:
  enabled: true  # Enable XAI processing
  methods:
    gradcam: true   # Enable Grad-CAM (fast, good for visualization)
    lrp: true       # Enable Layer-wise Relevance Propagation (moderate cost)
    shap: true      # Enable SHAP
  sample_limit: 16  # Limit XAI processing to first 16 images per round
  target_layer: "model.9"  # SPPF — shared backbone, upstream of all FPN levels
  background_set_size: 75  # Number of background images for SHAP (when enabled)
  output_overlays: true    # Save attribution maps overlaid on original images
