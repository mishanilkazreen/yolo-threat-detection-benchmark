# YOLOv8n Pretrained with only detect head training (backbone + neck frozen).
# Strongest version of the "frozen embeddings + random head" hypothesis.
#
# freeze=22: freeze backbone (0-9) + neck (10-21); only detect head (22) trains.
# Protocol otherwise matches MDPI: 10 epochs/round, 5 rounds, AdamW.

training:
  epochs: 50
  epochs_per_round: 10
  rounds: 5
  patience: 0  # No early stopping — match MDPI protocol
  image_size: 640
  batch_size: 16
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.1
  freeze: 22  # Freeze backbone + neck; train only detect head
  runs: 1
  seeds: [42]
  device: "0"
  run_baseline: false

model:
  name: "yolov8n"
  weights: "yolov8n.pt"

data:
  yaml_path: "config/data/weapon_detection_data.yaml"
  train_init_percentage: 0.2
  iou_threshold: 0.5

augmentation:
  mosaic: 1.0
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

xai:
  enabled: false
  methods:
    gradcam: true
    lrp: false
    shap: false
  sample_limit: 16
  target_layer: "model.18"
  background_set_size: 75
  output_overlays: true
